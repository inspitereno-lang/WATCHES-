<!doctype html>
<html lang="en" dir="ltr" class="language-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const isAdmin = window.location.pathname.startsWith('/admin')
          const language = isAdmin ? 'en' : (localStorage.getItem('t24_lang') || 'en')
          document.documentElement.lang = language
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr'
        } catch {
          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }

        window.setTimeout(() => {
          document.documentElement.classList.remove('language-booting')
        }, 1200)
      })()
    </script>
    <title>Luxury Watches in Dubai | Dubai Watches Gallery</title>
    <link rel="canonical" href="%SITE_URL%/" />
    
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore Dubai Watches Gallery for a curated selection of luxury and premium watches in Dubai. Discover our collections and find the right watch for your style." />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Luxury Watches in Dubai | Dubai Watches Gallery" />
    <meta property="og:description" content="Explore Dubai Watches Gallery for a curated selection of luxury and premium watches in Dubai. Discover our collections and find the right watch for your style." />
    <meta property="og:image" content="/watch-grid-1.jpg" />
    <meta property="og:url" content="%SITE_URL%/" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Luxury Watches in Dubai | Dubai Watches Gallery" />
    <meta name="twitter:description" content="Explore Dubai Watches Gallery for a curated selection of luxury and premium watches in Dubai. Discover our collections and find the right watch for your style." />
    <meta name="twitter:image" content="%SITE_URL%/watch-grid-1.jpg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="https://res.cloudinary.com/dwqxzzqpn/video/upload/q_auto,f_auto,so_0/v1787902113/t24_watches_videos/hero_video_transition_clean.jpg" fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Tajawal:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- One authoritative store entity, shared by the website schema. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Store",
            "@id": "%SITE_URL%/#store",
            "name": "Dubai Watches Gallery",
            "url": "%SITE_URL%/",
            "image": "%SITE_URL%/dubai-watches-gallery-logo.webp"
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Dubai Watches Gallery",
            "publisher": { "@id": "%SITE_URL%/#store" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
